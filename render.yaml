services:
  - type: web
    name: elevateu-backend
    env: python
    region: oregon
    plan: free
    buildCommand: >
      pip install -r Backend/requirements.txt &&
      cd Backend &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: >
      cd Backend &&
      gunicorn elevateu_backend.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: elevateu-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://<your-frontend-url>"

databases:
  - name: elevateu-db
    databaseName: elevateu_db
    user: elevateu_user
    plan: free
    region: oregon
