<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Profile — ElevateU</title>
  <link rel="stylesheet" href="global.css">
  <style>
    .nav nav {
      display: flex;
      gap: 24px;
      align-items: center;
    }
    .nav nav a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 10px;
      transition: all 0.3s ease;
    }
    .nav nav a:hover {
      color: var(--text);
      background: rgba(108, 99, 255, 0.1);
    }
    .nav nav a.active {
      color: var(--primary);
      background: linear-gradient(90deg,var(--primary)20%,transparent);
    }
    .logout-btn {
      padding: 8px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .logout-btn:hover {
      background: var(--primary-600);
      box-shadow: 0 4px 12px rgba(108, 99, 255, 0.4);
    }
    .profile-banner {
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      height: 180px;
      border-radius: var(--radius);
      margin-bottom: 40px;
      position: relative;
    }
    .profile-header {
      display: flex;
      gap: 32px;
      align-items: center;
      margin-bottom: 40px;
      position: relative;
      margin-top: -60px;
    }
    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981, #34d399);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      color: white;
      font-weight: 800;
      border: 4px solid var(--card);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
      flex-shrink: 0;
    }
    .profile-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .profile-info h1 {
      font-size: 28px;
      margin: 0 0 6px 0;
      color: var(--text);
      font-weight: 800;
    }
    .profile-info .dept {
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .profile-info .bio {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 0;
    }
    .profile-stats {
      display: flex;
      gap: 48px;
      margin-left: auto;
    }
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-num {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
    }
    .stat-label {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }
    .photo-upload {
      margin-top: 12px;
    }
    .photo-upload input[type="file"] {
      display: none;
    }
    .change-photo-link {
      color: var(--primary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-block;
    }
    .change-photo-link:hover {
      text-decoration: underline;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .card h2 {
      font-size: 20px;
      margin: 0 0 20px 0;
      color: var(--text);
    }
    .user-posts {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .post-card {
      background: linear-gradient(135deg, rgba(108, 99, 255, 0.05), rgba(139, 92, 246, 0.05));
      border: 1px solid rgba(108, 99, 255, 0.2);
      border-radius: 12px;
      padding: 16px;
      transition: all 0.3s ease;
    }
    .post-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(108, 99, 255, 0.1);
      border-color: rgba(108, 99, 255, 0.3);
    }
    .post-header {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      align-items: flex-start;
    }
    .post-avatar {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      flex-shrink: 0;
    }
    .post-meta {
      flex: 1;
    }
    .post-meta .name {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }
    .post-meta .date {
      font-size: 12px;
      color: var(--muted);
    }
    .post-content {
      margin-bottom: 12px;
      line-height: 1.6;
      color: var(--text);
    }
    .post-image {
      width: 100%;
      border-radius: 8px;
      margin: 12px 0;
      max-height: 400px;
      object-fit: cover;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
    }
    :root.dark .form-group input,
    :root.dark .form-group textarea {
      border-color: rgba(255, 255, 255, 0.1);
    }
    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }
    .save-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .save-btn:hover {
      background: var(--primary-600);
      box-shadow: 0 4px 12px rgba(108, 99, 255, 0.4);
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    .empty-state div {
      font-size: 48px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="nav">
    <div style="display:flex;gap:16px;align-items:center">
      <div class="brand">ElevateU</div>
      <nav>
        <a href="feed.html">Feed</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="profile.html" class="active">Profile</a>
      </nav>
    </div>
    <div class="nav-links">
      <div class="small" id="navUsername">Loading...</div>
      <button class="logout-btn" id="logoutBtn">Logout</button>
      <button class="theme-btn theme-toggle">🌓 Theme</button>
    </div>
  </div>

  <div class="container">
    <div class="profile-banner"></div>

    <div class="profile-header">
      <div style="flex-shrink: 0;">
        <div class="profile-avatar" id="profileAvatar">T</div>
        <div class="photo-upload">
          <input type="file" id="photoInput" accept="image/*" />
          <a href="#" class="change-photo-link" id="changePhotoBtn">Change Photo</a>
        </div>
      </div>
      <div class="profile-info">
        <h1 id="profileNameDisplay" style="display: none;">Loading...</h1>
        <div class="dept" id="profileDeptDisplay" style="display: none;">Loading...</div>
        <div class="bio" id="profileBioDisplay" style="display: none;">Loading...</div>
      </div>
      <div class="profile-stats">
        <div class="stat">
          <div class="stat-num" id="achievementsCount">0</div>
          <div class="stat-label">Achievements</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="followersCount">0</div>
          <div class="stat-label">Followers</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="followingCount">0</div>
          <div class="stat-label">Following</div>
        </div>
      </div>
    </div>

    <div class="layout" style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 1000px; margin: 0 auto;">
      <div class="card">
        <h2>Edit Profile</h2>
        <form id="editProfileForm">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="profileFirstName" value="Test" />
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="profileLastName" value="User" />
          </div>
          <div class="form-group">
            <label>Department</label>
            <input type="text" id="profileDept" value="General" />
          </div>
          <div class="form-group">
            <label>Bio</label>
            <textarea id="profileBio" placeholder="Tell us about yourself...">i am batman</textarea>
          </div>
          <button type="submit" class="save-btn">Save Changes</button>
        </form>
      </div>

      <div class="card">
        <h2>My Achievements</h2>
        <div class="empty-state">
          <div>📝</div>
          <p>No achievements posted yet. Share your first one!</p>
        </div>
      </div>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="api-client.js"></script>
  <script>
    // Logout functionality
    document.getElementById('logoutBtn').addEventListener('click', () => {
      api.logout()
      window.location.href = 'index.html'
    })

    // Photo upload functionality
    document.getElementById('changePhotoBtn').addEventListener('click', (e) => {
      e.preventDefault()
      document.getElementById('photoInput').click()
    })

    document.getElementById('photoInput').addEventListener('change', (e) => {
      const file = e.target.files[0]
      if (file) {
        const reader = new FileReader()
        reader.onload = (event) => {
          const photoDataUrl = event.target.result
          
          console.log('Uploading profile photo, data URL length:', photoDataUrl.length)
          
          // Save to backend via API
          api.updateProfile({
            profile_photo: photoDataUrl
          }).then((response) => {
            console.log('Photo upload response:', response)
            // Display the photo
            document.getElementById('profileAvatar').style.backgroundImage = `url(${photoDataUrl})`
            document.getElementById('profileAvatar').style.backgroundSize = 'cover'
            document.getElementById('profileAvatar').style.backgroundPosition = 'center'
            document.getElementById('profileAvatar').textContent = ''
            alert('Profile photo updated successfully!')
            // Reload page to show updated data from backend
            setTimeout(() => window.location.reload(), 1500)
          }).catch((err) => {
            console.error('Error saving photo:', err)
            alert('Error saving photo to profile: ' + err.message)
          })
        }
        reader.readAsDataURL(file)
      }
    })

    // Load user profile on page load
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // Check if user is logged in
        if (!api.accessToken) {
          window.location.href = 'login.html'
          return
        }
        
        const user = await api.getMe()
        
        // Create full name for display
        const fullName = `${user.first_name} ${user.last_name}`.trim() || user.username
        
        // Update navbar username - show just username
        document.getElementById('navUsername').textContent = user.username
        
        // Update profile avatar
        const profileAvatar = document.getElementById('profileAvatar')
        if (user.profile_photo) {
          profileAvatar.style.backgroundImage = `url(${user.profile_photo})`
          profileAvatar.style.backgroundSize = 'cover'
          profileAvatar.style.backgroundPosition = 'center'
          profileAvatar.textContent = ''
        } else {
          // Show initial letter if no profile photo
          profileAvatar.style.backgroundImage = 'none'
          profileAvatar.textContent = (user.first_name || user.username).charAt(0).toUpperCase()
        }
        
        // Update profile info display
        const nameDisplay = document.getElementById('profileNameDisplay')
        const deptDisplay = document.getElementById('profileDeptDisplay')
        const bioDisplay = document.getElementById('profileBioDisplay')
        
        nameDisplay.textContent = fullName
        nameDisplay.style.display = 'block'
        
        deptDisplay.textContent = user.field_of_interest || 'Not specified'
        deptDisplay.style.display = 'block'
        
        bioDisplay.textContent = user.bio || 'No bio yet'
        bioDisplay.style.display = 'block'
        document.getElementById('profileBioDisplay').textContent = user.bio || 'No bio yet'
        
        // Update stats
        document.getElementById('achievementsCount').textContent = user.achievements || 0
        document.getElementById('followersCount').textContent = user.profile?.followers || 0
        document.getElementById('followingCount').textContent = user.profile?.following || 0
        
        // Fill edit form
        document.getElementById('profileFirstName').value = user.first_name || ''
        document.getElementById('profileLastName').value = user.last_name || ''
        document.getElementById('profileDept').value = user.field_of_interest || ''
        document.getElementById('profileBio').value = user.bio || ''
        
        // Load and display user's posts/achievements
        try {
          const postsResponse = await fetch(`${api.baseURL}/api/posts/?user=${user.id}`, {
            headers: {
              'Authorization': api.accessToken ? `Bearer ${api.accessToken}` : '',
              'Content-Type': 'application/json',
            }
          })
          
          if (postsResponse.ok) {
            const posts = await postsResponse.json()
            const achievementsCard = document.querySelector('.card:last-child')
            
            if (posts && posts.length > 0) {
              achievementsCard.innerHTML = `
                <h2>My Achievements</h2>
                <div class="user-posts">
                  ${posts.map(post => `
                    <div class="post-card">
                      <div class="post-header">
                        <div class="post-avatar">${(user.first_name || user.username).charAt(0).toUpperCase()}</div>
                        <div class="post-meta">
                          <div class="name">${fullName}</div>
                          <div class="date">${new Date(post.created_at).toLocaleDateString()}</div>
                        </div>
                      </div>
                      <div class="post-content">${post.description}</div>
                      ${post.image ? `<img src="${post.image}" class="post-image" alt="Post" />` : ''}
                    </div>
                  `).join('')}
                </div>
              `
            }
          }
        } catch (error) {
          console.error('Error loading posts:', error)
        }
      } catch (error) {
        console.error('Error loading profile:', error)
        alert('Error loading profile: ' + error.message)
      }
    })

    // Edit profile form
    document.getElementById('editProfileForm').addEventListener('submit', async (e) => {
      e.preventDefault()
      const firstName = document.getElementById('profileFirstName').value
      const lastName = document.getElementById('profileLastName').value
      const dept = document.getElementById('profileDept').value
      const bio = document.getElementById('profileBio').value

      try {
        const response = await api.updateProfile({
          first_name: firstName,
          last_name: lastName,
          field_of_interest: dept,
          bio: bio
        })
        
        console.log('Profile updated successfully:', response)
        alert('Profile updated successfully!')
        
        // Update displayed profile
        const fullName = `${response.first_name} ${response.last_name}`.trim() || response.username
        document.getElementById('profileNameDisplay').textContent = fullName
        document.getElementById('profileDeptDisplay').textContent = response.field_of_interest || 'Not specified'
        document.getElementById('profileBioDisplay').textContent = response.bio || 'No bio yet'
        
        // Reload page after 1.5 seconds to reflect changes from backend
        setTimeout(() => {
          window.location.reload()
        }, 1500)
      } catch (error) {
        console.error('Error updating profile:', error)
        alert('Failed to update profile: ' + error.message)
      }
    })
  </script>
</body>
</html>
