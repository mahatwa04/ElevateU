<!DOCTYPE html>
<html>
<head>
    <title>ElevateU Production Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        .test { background: white; padding: 15px; margin: 10px 0; border-left: 4px solid #ccc; }
        .test.pass { border-left-color: green; }
        .test.fail { border-left-color: red; }
        .test.pending { border-left-color: orange; }
        h2 { margin-top: 0; }
        code { background: #f0f0f0; padding: 2px 5px; }
    </style>
</head>
<body>
    <h1>ElevateU Production Test</h1>
    
    <div id="tests"></div>
    
    <script>
        const testsDiv = document.getElementById('tests');
        
        async function runTest(name, fn) {
            const div = document.createElement('div');
            div.className = 'test pending';
            div.innerHTML = `<h2>${name}</h2><p>Running...</p>`;
            testsDiv.appendChild(div);
            
            try {
                const result = await fn();
                div.className = 'test pass';
                div.innerHTML = `<h2>✓ ${name}</h2><p>${result}</p>`;
            } catch (error) {
                div.className = 'test fail';
                div.innerHTML = `<h2>✗ ${name}</h2><p>${error.message}</p>`;
            }
        }
        
        // Test 1: Check if we can reach the backend
        runTest('Backend Connection', async () => {
            const response = await fetch('https://elevateu-backend-777j.onrender.com/api/health/');
            if (response.ok) {
                const data = await response.json();
                return `Backend is accessible: ${JSON.stringify(data)}`;
            }
            throw new Error(`HTTP ${response.status}`);
        });
        
        // Test 2: Check CORS headers
        runTest('CORS Headers', async () => {
            const response = await fetch('https://elevateu-backend-777j.onrender.com/api/auth/token/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: 'test@test.com', password: 'test' })
            });
            const corsHeader = response.headers.get('Access-Control-Allow-Origin');
            if (corsHeader) {
                return `CORS enabled: ${corsHeader}`;
            }
            // 400 is expected for bad credentials, but we're checking if we get here
            if (response.status === 400) {
                return 'Backend responds to auth endpoint (CORS working)';
            }
            throw new Error(`HTTP ${response.status}`);
        });
        
        // Test 3: Test local API URL detection
        runTest('Frontend Environment', async () => {
            const hostname = window.location.hostname;
            const isProduction = hostname !== 'localhost' && hostname !== '127.0.0.1';
            return `Hostname: <code>${hostname}</code>, Env: ${isProduction ? 'PRODUCTION' : 'DEVELOPMENT'}`;
        });
    </script>
</body>
</html>
